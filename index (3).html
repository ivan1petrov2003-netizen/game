<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Light</title>
<style>
html,body{margin:0;height:100%;background:#050607;color:#dfe6e0;font:15px Georgia,'Times New Roman',serif;overflow:hidden}
canvas{display:block;position:fixed;inset:0}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 70%,#3a2410,#0a0d08 55%,#030404)}
.box{background:#0d110ce6;border:1px solid #4a3a22;padding:30px 34px;border-radius:4px;width:330px;text-align:center;box-shadow:0 0 60px #ff8a2a22}
h1{margin:0 0 2px;font-size:46px;font-weight:400;font-style:italic;color:#ffd9a0;text-shadow:0 0 26px #ff9a3a}
.sub{color:#9a9a84;margin:0 0 18px}
input,button{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;border-radius:3px;border:1px solid #4a4030;background:#0a0c08;color:#f3ead8;font:inherit}
button{background:#8a4a14;cursor:pointer;border-color:#c07a30}button:hover{background:#a85c1a}
button.alt{background:#1a1810}
.hide{display:none!important}#err{color:#ff9a8a;min-height:20px}#pl{text-align:left;margin:12px 0;line-height:1.7}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">
 <div class="box" id="m"><h1>Last Light</h1><p class="sub">Продержитесь до рассвета. Вместе.</p>
  <input id="nm" maxlength="12" placeholder="Ваш ник"><button id="cr">Создать комнату</button>
  <input id="cd" maxlength="4" placeholder="Код комнаты" style="text-transform:uppercase;text-align:center">
  <button id="jn" class="alt">Войти по коду</button><div id="err"></div></div>
 <div class="box hide" id="lb"><h1 id="lt">Комната</h1><p class="sub" id="lc"></p><div id="pl"></div>
  <button id="go">Начать игру</button><p class="sub" id="wt">Ждём, пока хозяин начнёт игру</p>
  <p class="sub" style="font-size:13px">WASD — ходьба, мышь — прицел и огонь, E — обыскать ящик, 1-2-3 — оружие</p></div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d'),lc=document.createElement('canvas'),lg=lc.getContext('2d');
const MW=2400,MH=2400,COL=['#4fc3f7','#ffb74d','#ba68c8','#81c784','#f06292','#fff176'],R=Math.random;
let ws,me=0,host=0,code='',names={},playing=false,vw=0,vh=0,M=null,S=null,sg=null,opened=new Set();
const P=new Map(),Z=new Map(),L=new Map();
let B=[],info={wave:0,left:0,brk:0},parts=[],flashes=[],shake=0,keys={},mouse={x:0,y:0,d:0},cam={x:MW/2,y:MH/2},wantW='',aim=0;
function fit(){vw=cv.width=lc.width=innerWidth;vh=cv.height=lc.height=innerHeight}addEventListener('resize',fit);fit();
$('nm').value=localStorage.ll_name||'';if(location.hash)$('cd').value=location.hash.slice(1,5);

// ---- сеть ----
function join(c){const name=$('nm').value.trim()||'Выживший';localStorage.ll_name=name;
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>ws.send(JSON.stringify({t:'join',name,code:c}));
 ws.onerror=()=>{$('err').textContent='Не удаётся подключиться к серверу'};
 ws.onclose=()=>{playing=false;$('ui').classList.remove('hide');$('m').classList.remove('hide');$('lb').classList.add('hide');$('err').textContent='Соединение потеряно'};
 ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.t==='err')$('err').textContent=d.m;else if(d.t==='lobby')lobby(d);else if(d.t==='s')state(d)}}
$('cr').onclick=()=>join('');$('jn').onclick=()=>join($('cd').value);$('go').onclick=()=>ws.send('{"t":"start"}');
function lobby(d){me=d.me;host=d.host;code=d.code;names=Object.fromEntries(d.names);const over=d.st==='over';playing=d.st==='play';
 if(d.map&&(!M||M.id!==d.map.id)){P.clear();Z.clear();L.clear();B=[];buildMap(d.map)}
 if(playing){$('ui').classList.add('hide');return}
 $('ui').classList.remove('hide');$('m').classList.add('hide');$('lb').classList.remove('hide');
 $('lt').textContent=over?'Рассвета не будет':'Комната';
 $('lc').innerHTML=(over?'Вы продержались до волны '+d.wave+'<br>':'')+'Код: <b style="font-size:26px;letter-spacing:4px;color:#ffd9a0">'+code+'</b><br>Ссылка: '+location.origin+'/#'+code;
 $('pl').innerHTML=d.names.map(n=>'<span style="color:'+COL[n[0]%6]+'">●</span> '+n[1]+(n[0]===host?' (хозяин)':'')).join('<br>');
 $('go').classList.toggle('hide',me!==host);$('wt').classList.toggle('hide',me===host);$('go').textContent=over?'Сыграть ещё раз':'Начать игру'}
function state(d){info=d;opened=new Set(d.co);let seen=new Set();
 for(const a of d.p){seen.add(a[0]);let p=P.get(a[0]);if(!p){p={x:a[1],y:a[2],ph:0,sq:0,rc:0};P.set(a[0],p)}
  Object.assign(p,{id:a[0],tx:a[1],ty:a[2],a:a[3],hp:a[4],alive:a[5],sc:a[7],w:a[8],am:a[9],hm:a[10],ar:a[11]});
  if(a[6]){p.sq=1;p.rc=1;const x=p.x+Math.cos(p.a)*28,y=p.y+Math.sin(p.a)*28;flashes.push({x,y,l:.08});
   for(let i=0;i<3;i++)parts.push({x,y,vx:Math.cos(p.a+R()-.5)*320,vy:Math.sin(p.a+R()-.5)*320,l:.15,c:'#ffd27a',s:2});
   if(a[0]===me){shake=Math.min(5,shake+(p.w==='shotgun'?4:1.2));snd(p.w==='shotgun'?120:240,.09,'sawtooth')}}}
 for(const k of P.keys())if(!seen.has(k))P.delete(k);seen=new Set();
 for(const a of d.z){seen.add(a[0]);let z=Z.get(a[0]);if(!z){z={x:a[1],y:a[2],a:0,ph:R()*6,fl:0,hp:1};Z.set(a[0],z)}
  if(a[4]<z.hp)z.fl=.1;z.tx=a[1];z.ty=a[2];z.t=a[3];z.hp=a[4]}
 for(const k of Z.keys())if(!seen.has(k))Z.delete(k);seen=new Set();
 for(const a of d.l){seen.add(a[0]);if(!L.has(a[0]))L.set(a[0],{x:a[1],y:a[2],t:a[3]})}
 for(const k of L.keys())if(!seen.has(k))L.delete(k);B=d.b;
 for(const [t,x,y] of d.ev){
  if(t==='h')blood(x,y,5,'#7a1010');
  else if(t==='k'){blood(x,y,16,'#5c0a0a');splat(x,y,1);snd(80,.18,'square',.06)}
  else if(t==='o'){for(let i=0;i<8;i++)parts.push({x,y,vx:(R()-.5)*120,vy:(R()-.5)*120,l:.5,c:'#8a7a5a',s:3});snd(300,.12,'triangle',.05)}
  else{blood(x,y,8,'#c01818');splat(x,y,0);const m=P.get(me);if(m&&Math.hypot(m.x-x,m.y-y)<40){shake=8;snd(150,.2,'sawtooth',.07)}}}}
function blood(x,y,n,c){for(let i=0;i<n;i++){const a=R()*6.28,s=60+R()*200;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.3+R()*.4,c,s:2+R()*3})}}
function splat(x,y,big){if(!sg)return;sg.fillStyle='rgba(95,8,8,.5)';for(let i=0;i<(big?7:3);i++){sg.beginPath();sg.ellipse(x+(R()-.5)*(big?40:18),y+(R()-.5)*(big?40:18),2+R()*(big?9:4),2+R()*(big?6:3),R()*3,0,6.28);sg.fill()}}
let ac;function snd(f,d,type='square',v=.04){try{ac=ac||new AudioContext();const o=ac.createOscillator(),n=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(40,t+d);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n).connect(ac.destination);o.start();o.stop(t+d)}catch{}}
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Digit1')wantW='pistol';if(e.code==='Digit2')wantW='shotgun';if(e.code==='Digit3')wantW='smg'});
addEventListener('keyup',e=>keys[e.code]=0);
cv.onmousemove=e=>{mouse.x=e.clientX;mouse.y=e.clientY};cv.onmousedown=()=>mouse.d=1;addEventListener('mouseup',()=>mouse.d=0);cv.oncontextmenu=e=>e.preventDefault();
setInterval(()=>{if(!playing||!ws||ws.readyState!==1)return;
 const dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
 ws.send(JSON.stringify({t:'in',dx,dy,a:aim,s:mouse.d,e:keys.KeyE?1:0,w:wantW}));wantW=''},33);

// ---- карта: рисуется один раз в буфер (слои: земля, дороги, полы, стены) ----
function buildMap(m){M=m;S=document.createElement('canvas');S.width=MW;S.height=MH;const s=sg=S.getContext('2d');
 s.fillStyle='#1c2918';s.fillRect(0,0,MW,MH);
 for(let i=0;i<6000;i++){s.fillStyle=['#223220','#172314','#27341c','#2a2c1a'][i%4];s.globalAlpha=.55;s.beginPath();s.ellipse(R()*MW,R()*MH,5+R()*28,4+R()*16,R()*3,0,6.28);s.fill()}
 s.globalAlpha=1;s.fillStyle='#2b2b29';for(let k=1;k<5;k++){s.fillRect(k*480-36,0,72,MH);s.fillRect(0,k*480-36,MW,72)}
 s.strokeStyle='#7a6a32';s.lineWidth=3;s.setLineDash([26,22]);s.beginPath();for(let k=1;k<5;k++){s.moveTo(k*480,0);s.lineTo(k*480,MH);s.moveTo(0,k*480);s.lineTo(MW,k*480)}s.stroke();s.setLineDash([]);
 for(let i=0;i<500;i++){s.fillStyle='#222220';s.fillRect(R()*MW,(1+(R()*4|0))*480-30+R()*60,4+R()*14,2)}
 s.fillStyle='#35322b';s.beginPath();s.arc(MW/2,MH/2,190,0,6.28);s.fill();s.strokeStyle='#4a463a';s.lineWidth=6;s.stroke();
 for(const b of m.b){s.fillStyle='#0006';s.fillRect(b[0]+10,b[1]+12,b[2],b[3])}
 for(const [x,y,w,h,d] of m.b){s.fillStyle='#4d3a27';s.fillRect(x,y,w,h);s.strokeStyle='#3b2c1d';s.lineWidth=1;s.beginPath();for(let j=y;j<y+h;j+=16){s.moveTo(x,j);s.lineTo(x+w,j)}s.stroke();
  s.fillStyle='#6a2b2b88';s.fillRect(x+w*.3,y+h*.3,w*.4,h*.4);s.strokeStyle='#c9a24a55';s.strokeRect(x+w*.3,y+h*.3,w*.4,h*.4)}
 for(const [x,y,w,h] of m.w){s.fillStyle='#5a5953';s.fillRect(x,y,w,h);s.fillStyle='#86847b';s.fillRect(x,y,w,3);s.fillStyle='#2b2a27';s.fillRect(x,y+h-3,w,3)}
 s.strokeStyle='#5a1a12';s.lineWidth=10;s.strokeRect(0,0,MW,MH)}

// ---- рисование существ (ходьба, отдача, сквош) ----
function drawZ(z){const r={walker:15,runner:13,tank:26}[z.t],f=z.fl>0,c=f?'#fff':{walker:'#5f7f4a',runner:'#8f9a42',tank:'#5a4468'}[z.t],s=Math.sin(z.ph);
 g.save();g.translate(z.x,z.y);g.fillStyle='#0007';g.beginPath();g.ellipse(2,r*.5,r,r*.7,0,0,6.28);g.fill();g.rotate(z.a);
 g.fillStyle='#262620';for(const k of[-1,1]){g.beginPath();g.ellipse(s*k*r*.5,k*r*.4,r*.4,r*.25,0,0,6.28);g.fill()}
 g.fillStyle=c;for(const k of[-1,1]){g.save();g.translate(r*.2,k*r*.8);g.rotate(-k*(.2+s*k*.25));g.fillRect(0,-3,r*1.1,6);g.fillStyle=f?'#fff':'#a8b890';g.beginPath();g.arc(r*1.1,0,3.3,0,6.28);g.fill();g.restore()}
 g.beginPath();g.ellipse(0,0,r*.8,r,0,0,6.28);g.fill();g.fillStyle='#0004';g.fillRect(-r*.5,-r*.3,r*.5,3);
 g.fillStyle=f?'#fff':'#9aad84';g.beginPath();g.arc(r*.15,0,r*.55,0,6.28);g.fill();g.restore();
 if(z.hp<1){g.fillStyle='#300';g.fillRect(z.x-15,z.y-r-10,30,4);g.fillStyle='#d33';g.fillRect(z.x-15,z.y-r-10,30*z.hp,4)}}
function drawP(p){const c=COL[p.id%6],s=Math.sin(p.ph);g.save();g.translate(p.x,p.y);g.fillStyle='#0007';g.beginPath();g.ellipse(2,8,14,10,0,0,6.28);g.fill();
 if(!p.alive){g.strokeStyle=c;g.lineWidth=3;g.globalAlpha=.6;g.beginPath();g.moveTo(-9,-9);g.lineTo(9,9);g.moveTo(9,-9);g.lineTo(-9,9);g.stroke()}
 else{g.rotate(p.a);const q=1+p.sq*.12;g.scale(q,2-q);g.fillStyle='#1c1c1c';for(const k of[-1,1]){g.beginPath();g.ellipse(s*k*6,k*5,6,3.5,0,0,6.28);g.fill()}
  const o=p.rc*5;g.fillStyle='#14171a';g.fillRect(8-o,-2.5,p.w==='pistol'?14:p.w==='smg'?20:27,5);
  g.strokeStyle=c;g.lineWidth=4;g.beginPath();g.moveTo(0,-9);g.lineTo(15-o,-2);g.moveTo(0,9);g.lineTo(15-o,2);g.stroke();
  g.fillStyle=c;g.beginPath();g.ellipse(0,0,8,13,0,0,6.28);g.fill();if(p.ar>0){g.strokeStyle='#9fc4dd';g.lineWidth=2;g.stroke()}
  g.fillStyle='#e0b894';g.beginPath();g.arc(1,0,7.5,0,6.28);g.fill();g.fillStyle='#2a1d14';g.beginPath();g.arc(-1,0,7.5,1.6,4.7);g.fill()}
 g.restore();g.fillStyle='#fff';g.font='12px Georgia';g.textAlign='center';g.fillText(names[p.id]||'',p.x,p.y-26)}
function drawLoot(l,t){const c={shotgun:'#ff9a3c',smg:'#ffd54a',ammo:'#9ad0ff',med:'#ff5a6a',armor:'#6fb4e8'}[l.t],y=l.y+Math.sin(t*4+l.x)*2;
 g.shadowColor=c;g.shadowBlur=20;g.fillStyle=c;g.beginPath();g.arc(l.x,y,10,0,6.28);g.fill();g.shadowBlur=0;g.fillStyle='#fff';
 if(l.t==='med'){g.fillRect(l.x-1.5,y-6,3,12);g.fillRect(l.x-6,y-1.5,12,3)}else if(l.t==='ammo'){for(let i=-1;i<2;i++)g.fillRect(l.x+i*4-1,y-5,2,10)}
 else if(l.t==='armor'){g.beginPath();g.moveTo(l.x-6,y-5);g.lineTo(l.x+6,y-5);g.lineTo(l.x,y+7);g.fill()}else{g.fillRect(l.x-7,y-2,14,4)}}
function drawCrate(c){const o=opened.has(c[0]);g.fillStyle='#0006';g.fillRect(c[1]-14,c[2]-8,30,24);g.fillStyle=o?'#3b2d1c':'#8a6234';g.fillRect(c[1]-15,c[2]-11,30,22);
 g.strokeStyle=o?'#241a10':'#c9944a';g.lineWidth=2;g.strokeRect(c[1]-15,c[2]-11,30,22);g.beginPath();g.moveTo(c[1]-15,c[2]);g.lineTo(c[1]+15,c[2]);g.stroke();
 if(!o){g.globalAlpha=.4+.3*Math.sin(T*5+c[0]);g.strokeStyle='#ffe08a';g.strokeRect(c[1]-18,c[2]-14,36,28);g.globalAlpha=1}}
const inB=(e,b)=>e.x>b[0]&&e.x<b[0]+b[2]&&e.y>b[1]&&e.y<b[1]+b[3];
function lightAt(x,y,rad,a,cone){const gr=lg.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,'rgba(0,0,0,.96)');gr.addColorStop(1,'rgba(0,0,0,0)');lg.fillStyle=gr;lg.beginPath();
 if(cone){lg.moveTo(x,y);lg.arc(x,y,rad,a-.4,a+.4)}else lg.arc(x,y,rad,0,6.28);lg.fill()}
let last=performance.now(),T=0,T0=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;T0=T;requestAnimationFrame(frame);
 g.fillStyle='#050607';g.fillRect(0,0,vw,vh);if(!P.size||!S)return;
 const k=1-Math.exp(-dt*16);
 for(const p of P.values()){const dx=(p.tx-p.x)*k,dy=(p.ty-p.y)*k;p.x+=dx;p.y+=dy;p.ph+=Math.hypot(dx,dy)*.14;p.sq*=Math.exp(-dt*14);p.rc*=Math.exp(-dt*18)}
 for(const z of Z.values()){const dx=z.tx-z.x,dy=z.ty-z.y;if(Math.hypot(dx,dy)>.5)z.a=Math.atan2(dy,dx);z.x+=dx*k;z.y+=dy*k;z.ph+=Math.hypot(dx*k,dy*k)*.12;z.fl-=dt;z.h=M.b.some(b=>b.ra>.5&&inB(z,b))}
 const m=P.get(me),f=m&&m.alive?m:[...P.values()].find(p=>p.alive)||m,la=m&&m.alive?.2:0;
 const kc=1-Math.exp(-dt*7);cam.x+=(f.x+(mouse.x-vw/2)*la-cam.x)*kc;cam.y+=(f.y+(mouse.y-vh/2)*la-cam.y)*kc;shake*=Math.exp(-dt*14);
 const ox=vw/2-cam.x+(R()-.5)*shake,oy=vh/2-cam.y+(R()-.5)*shake;
 if(m){aim=Math.atan2(mouse.y-(m.y+oy),mouse.x-(m.x+ox));m.a=aim}
 g.save();g.translate(ox,oy);g.drawImage(S,0,0);
 // лагерь
 g.fillStyle='#2a1a10';g.fillRect(MW/2-16,MH/2-5,32,10);g.fillStyle='#1c1008';g.fillRect(MW/2-5,MH/2-16,10,32);
 if(R()<.7)parts.push({x:MW/2+(R()-.5)*14,y:MH/2+(R()-.5)*8,vx:(R()-.5)*30,vy:-90,l:.5,c:R()<.5?'#ff9a2a':'#ffd24a',s:4});
 for(const c of M.c)drawCrate(c);for(const l of L.values())drawLoot(l,T);
 for(const z of Z.values())if(!z.h)drawZ(z);for(const p of P.values())drawP(p);
 g.strokeStyle='#ffe9a0';g.lineWidth=2;g.beginPath();for(const b of B){g.moveTo(b[0],b[1]);g.lineTo(b[0]-Math.cos(b[2])*16,b[1]-Math.sin(b[2])*16)}g.stroke();
 for(const q of parts){q.l-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.93;q.vy*=.93;g.globalAlpha=Math.max(0,q.l*2);g.fillStyle=q.c;g.fillRect(q.x,q.y,q.s,q.s)}g.globalAlpha=1;parts=parts.filter(q=>q.l>0);
 // крыши (исчезают, когда вы внутри) и кроны деревьев
 for(const b of M.b){const t=m&&inB(m,b)?0:1;b.ra=(b.ra??1)+(t-(b.ra??1))*Math.min(1,dt*8);if(b.ra<.02)continue;g.globalAlpha=b.ra;
  g.fillStyle='#2c2420';g.fillRect(b[0]-8,b[1]-8,b[2]+16,b[3]+16);g.strokeStyle='#3d332c';g.lineWidth=2;g.beginPath();for(let y=b[1]-8;y<b[1]+b[3]+8;y+=13){g.moveTo(b[0]-8,y);g.lineTo(b[0]+b[2]+8,y)}g.stroke();
  g.fillStyle='#1b1613';g.fillRect(b[0]-8,b[1]+b[3]/2-3,b[2]+16,6);
  {const [x,y,w,h,d]=b,hz=d<2,a=((hz?w:h)-80)/2|0,T=14,dr=hz?[x+a,d===0?y-8:y+h-T,80,T+8]:[d===2?x-8:x+w-T,y+a,T+8,80];
   g.globalAlpha=b.ra*(.55+.25*Math.sin(T0*4));g.fillStyle='#e0a840';g.fillRect(dr[0],dr[1],dr[2],dr[3]);
   g.globalAlpha=b.ra;g.strokeStyle='#fff3c0';g.lineWidth=2;g.strokeRect(dr[0],dr[1],dr[2],dr[3]);
   g.fillStyle='#fff';g.font='bold 12px Georgia';g.textAlign='center';g.fillText('ВХОД',dr[0]+dr[2]/2,dr[1]+dr[3]/2+4)}}
 g.globalAlpha=1;
 for(const [x,y,r] of M.t){if(x<cam.x-vw/2-60||x>cam.x+vw/2+60||y<cam.y-vh/2-60||y>cam.y+vh/2+60)continue;const w=Math.sin(T+x)*1.5;
  g.fillStyle='#0005';g.beginPath();g.arc(x+8,y+10,r,0,6.28);g.fill();g.fillStyle='#142412';g.beginPath();g.arc(x+w,y,r,0,6.28);g.fill();g.fillStyle='#1d3319';g.beginPath();g.arc(x+w-r*.2,y-r*.2,r*.65,0,6.28);g.fill()}
 g.restore();
 // темнота: общий мрак, фонарики, костёр, лут, вспышки выстрелов
